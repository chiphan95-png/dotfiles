# Use the tmux prefix followed by <hjkl> for switching panes.
# (The Windows/Super key is handled by the local desktop/terminal and is not
# sent to tmux as a bindable key.)
bind h select-pane -L
bind l select-pane -R
bind k select-pane -U
bind j select-pane -D

# Enable Mouse Mode
set -g mouse on

# Tmux copy-mode selections
set -g set-clipboard on

# Set blinking line cursor
set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[5 q'

# Enable focus events for Neovim autoread support
set -g focus-events on

#Lengthen the amount of time status messages are displayed
set-option -g display-time 3000
set-option -g display-panes-time 3000

# Set the base-index to 1 rather than 0
set -g base-index 1
set-window-option -g pane-base-index 1

# Automatically set window title
set-window-option -g automatic-rename on
set-option -g set-titles on

# Plugin manager
set -g @plugin 'tmux-plugins/tpm'
run '~/.config/tmux/tMux.conf/Plugins/tpm/tpm'

# Plugins
set -g @continuum-restore 'on'
set -g @continuum-boot 'on'
run-shell /home/chiphan/.tmux/plugins/resurrect/resurrect.tmux
run-shell /home/chiphan/.tmux/plugins/continuum/continuum.tmux


# Theme
set-window-option -g window-status-current-style bold,bg=colour35,fg=colour234
set-window-option -g window-status-style fg=colour35
set -g window-status-activity-style bold,bg=colour39,fg=colour234
set-option -g message-style bg=colour237,fg=colour231
set-option -g pane-border-style fg=colour36
set-option -g pane-active-border-style fg=colour35

# Status Bar
set -g status-justify centre
set -g status-bg black
set -g status-fg colour35
set -g status-interval 60
set -g status-left-length 50
set -g status-left "#[bg=colour35]💻#[fg=colour234,bold] #H#[bg=colour34]#[bg=colour35,nobold]#[fg=colour234] [#S]"
set -g status-right '#[bg=colour35] 🕔 #[fg=colour234,bold]%H:%M '
